[project]
name = "entropy-gate"
version = "0.1.0"
description = "Token compression via entropy quenching — progressively freezes out low-information tokens while preserving semantic fidelity"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "typer>=0.15",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
# pytest lived in this venv only via a manual `uv pip install` — the lock
# never recorded it, so a fresh `uv sync` (i.e. CI) got no test runner.
# Declared here to match the sibling repos (palisade/strata); pytest-asyncio
# is required by asyncio_mode = "auto" above.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
